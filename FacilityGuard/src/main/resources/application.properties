# datasource configuration
quarkus.http.port=8080
quarkus.datasource.db-kind = h2
quarkus.datasource.username = sa
quarkus.datasource.jdbc.url = jdbc:h2:./test
quarkus.package.write-transformed-bytecode-to-build-output = true

# drop and create the database at startup (use `update` to only update the schema)
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.smallrye-openapi.info-title=Access Control API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API for managing building access, cards, and users.
quarkus.swagger-ui.always-include=true